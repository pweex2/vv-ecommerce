syntax = "proto3";

package inventory;

option go_package = "vv-ecommerce/pkg/proto/inventory";

service InventoryService {
  rpc DecreaseStock (DecreaseStockRequest) returns (DecreaseStockResponse);
}

message DecreaseStockRequest {
  string sku = 1;
  int64 quantity = 2;
  string request_id = 3;
  string order_id = 4;
  string trace_id = 5;
}

message DecreaseStockResponse {
  bool success = 1;
  string message = 2;
}
